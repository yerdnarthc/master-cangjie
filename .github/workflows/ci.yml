name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Disposable fixture credentials only; no development or production database is contacted.
env:
  DATABASE_URL: postgresql://mcj_app:mcj_app_local@127.0.0.1:5432/mcj_ci_test
  MIGRATION_DATABASE_URL: postgresql://mcj_migrate:mcj_migrate_local@127.0.0.1:5432/mcj_ci_test
  TEST_DATABASE_URL: postgresql://mcj_migrate:mcj_migrate_local@127.0.0.1:5432/mcj_ci_test
  WORKER_DATABASE_URL: postgresql://mcj_worker:mcj_worker_local@127.0.0.1:5432/mcj_ci_test
  MCJ_DEVELOPMENT_IDENTITY: 'true'
  MCJ_SESSION_SECRET: ci-only-disposable-session-secret-not-for-production
  MCJ_REAL_SANDBOX: 'false'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and architecture boundaries
        run: npm run check
      - name: Run domain tests
        run: npm run test:domain
      - name: Build production application
        run: npm run build

  persistence:
    name: Database and quiz journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_USER: mcj_migrate
          POSTGRES_PASSWORD: mcj_migrate_local
          POSTGRES_DB: mcj_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcj_migrate -d mcj_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # These suites share one test database: keep them in consecutive steps.
      # The integration fixtures apply migrations, create roles and publish content.
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run quiz and onboarding browser journeys
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: >-
          npm run test:journeys --
          tests/journeys/quiz-
          tests/journeys/onboarding-quizzes.spec.ts
          tests/journeys/onboarding-lessons.spec.ts
          --reporter=line,html
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
