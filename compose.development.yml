services:
  postgres:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: mcj_migrate
      POSTGRES_PASSWORD: mcj_migrate_local
      POSTGRES_DB: mcj_hello
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["hello-postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcj_migrate -d mcj_hello"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  hello-postgres:
